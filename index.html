<!DOCTYPE html>
<html>
<head>
    <title>Parser Benchmark: JS vs Rust WASM vs TS WASM</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1200px; margin: 40px auto; padding: 20px; }
        .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; background: #f9f9f9; }
        .card h3 { margin-top: 0; color: #333; }
        .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .stat:last-child { border-bottom: none; }
        .value { font-weight: bold; }
        .rust { border-left: 4px solid #f74c00; }
        .js { border-left: 4px solid #f7df1e; }
        .ts { border-left: 4px solid #3178c6; }
        button { padding: 12px 24px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #results { margin-top: 30px; }
        .chart-container { margin: 20px 0; padding: 20px; background: white; border-radius: 8px; }
        .bar { height: 30px; margin: 5px 0; border-radius: 4px; transition: width 0.3s; }
        .bar-label { display: flex; justify-content: space-between; padding: 0 10px; }
        .fastest { background: #28a745; }
        .medium { background: #ffc107; }
        .slow { background: #dc3545; }
    </style>
</head>
<body>
    <h1>🚀 Parser Benchmark: f64 from String</h1>
    <p>Сравнение производительности парсинга чисел с плавающей точкой</p>
    
    <div>
        <button onclick="runBenchmark()">▶ Запустить бенчмарк</button>
        <button onclick="runAccuracyTest()">🔍 Проверить точность</button>
    </div>

    <div id="results">
        <div class="results" id="stats"></div>
        <div id="chart"></div>
    </div>

    <div id="accuracy" style="margin-top: 30px;"></div>

    <script type="module" src="benchmark.js"></script>
</body>
</html>
