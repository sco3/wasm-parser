<!doctype html>
<html>
    <head>
        <title>Parser Benchmark: JS vs Rust WASM vs TS WASM</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1>Parser: f64 from String</h1>

        <div>
            <input type="text" id="input" value="1234.56" />
            <button onclick="parseInput()">Parse f64 rust</button>
            <button onclick="parseInput2()">Parse f64 javascript</button>
        </div>

        <div id="results">
            <div class="result" id="stats"></div>
        </div>

        <script type="module">
            import init, {
                parse_f64_rust,
            } from "./wasm-parser/pkg/rust_parser.js";
            await init();
            const n = 10_000_000;
            window.parseInput = function () {
                const value = document.getElementById("input").value;
                const start = performance.now();
                const result = parse_f64_rust(value, n);
                const end = performance.now();

                const nanoseconds = Math.round((end - start) * 1000000);

                document.getElementById("stats").innerHTML = `
                    Rust WASM:<br>
                    Результат: ${result}<br>
                    Время: ${nanoseconds} нс
                `;

                console.log(`Rust: ${result}, Время: ${nanoseconds} нс`);
                return result;
            };

            window.parseInput2 = function () {
                const value = document.getElementById("input").value;

                const start = performance.now();
                var result = 0;
                for (var i = 0; i < n; i++) {
                    result = parseFloat(value);
                }
                const end = performance.now();

                const nanoseconds = Math.round((end - start) * 1000000);

                document.getElementById("stats").innerHTML = `
                    JavaScript:<br>
                    Результат: ${result}<br>
                    Время: ${nanoseconds} нс
                `;

                console.log(`JS: ${result}, Время: ${nanoseconds} нс`);
                return result;
            };

            window.asdf = function () {
                const result = parse_f64_rust("1234.56");
                console.log(result);
                return result;
            };
        </script>
    </body>
</html>
